name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=moderate

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --target runtime --tag yandex-eats-mcp:ci .
      - name: Verify isolated container startup
        shell: bash
        run: |
          container_id=$(docker run --detach --rm --network none --read-only \
            --tmpfs /app/state:uid=1000,gid=1000,mode=700 \
            --env NODE_ENV=test --env MCP_AUTH_MODE=none yandex-eats-mcp:ci)
          trap 'docker rm --force "$container_id" >/dev/null' EXIT
          docker exec "$container_id" node --input-type=module -e '
            import assert from "node:assert/strict";
            import { setTimeout } from "node:timers/promises";
            for (let attempt = 0; attempt < 20; attempt++) {
              try {
                const response = await fetch("http://127.0.0.1:3000/readyz");
                assert.equal(response.status, 200);
                assert.equal((await response.json()).monitorEnabled, false);
                assert.equal(process.getuid(), 1000);
                process.exit(0);
              } catch {
                await setTimeout(500);
              }
            }
            process.exit(1);
          '
